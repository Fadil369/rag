<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام RAG التجريبي - BrainSAIT | Saudi Business RAG Chatbot</title>
    <meta name="description" content="تطبيق تجريبي تفاعلي لنظام RAG يدعم Google Gemini, Claude AI, و OpenAI GPT - مدعوم من برينسايت">
    <meta name="keywords" content="BrainSAIT, برينسايت, RAG, AI, Saudi Arabia, Arabic, NLP">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
      }
      
      body {
        background: linear-gradient(135deg, #1a365d 0%, #0f172a 100%);
      }

      /* NEURAL: Glass morphism effects */
      .glass-header {
        background: rgba(26, 54, 93, 0.8);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(14, 165, 233, 0.3);
      }

      .glass-footer {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(30px);
        border-top: 1px solid rgba(14, 165, 233, 0.3);
      }

      /* API Provider selector styling */
      .api-selector {
        display: flex;
        gap: 8px;
        padding: 4px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        border: 1px solid rgba(14, 165, 233, 0.2);
      }

      .api-option {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        color: rgba(255, 255, 255, 0.7);
      }

      .api-option:hover {
        background: rgba(14, 165, 233, 0.1);
        color: rgba(255, 255, 255, 0.9);
      }

      .api-option.active {
        background: linear-gradient(135deg, #0ea5e9, #2b6cb8);
        color: white;
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      }

      /* BrainSAIT color animations */
      .glow-teal {
        box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(14, 165, 233, 0.5); }
        50% { box-shadow: 0 0 30px rgba(14, 165, 233, 0.8); }
      }

      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #2b6cb8, #0ea5e9);
        border-radius: 10px;
      }

      /* Loading animation */
      .dot-pulse {
        animation: dot-pulse 1.5s ease-in-out infinite;
      }

      @keyframes dot-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .delay-150 { animation-delay: 150ms; }
      .delay-300 { animation-delay: 300ms; }

      /* BrainSAIT Footer branding */
      .brainsait-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
        padding: 8px;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(14, 165, 233, 0.2);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        z-index: 50;
      }

      .brainsait-footer a {
        color: #0ea5e9;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .brainsait-footer a:hover {
        color: #2b6cb8;
      }

      .brainsait-logo {
        font-weight: 600;
        background: linear-gradient(135deg, #0ea5e9, #2b6cb8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "react/": "https://esm.sh/react@18.2.0/",
        "@google/genai": "https://esm.sh/@google/genai@1.29.1"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    
    <!-- PDF and DOCX processing libraries -->
    <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.0/mammoth.browser.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = '//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>

    <!-- App initialization -->
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import App from './app.js';

      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        React.createElement(React.StrictMode, null,
          React.createElement(App, null)
        )
      );
    </script>
</body>
</html>
